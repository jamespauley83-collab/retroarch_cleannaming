[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retroarch-cleannaming"
version = "1.0.0"
description = "Rename retro game ROM files to match libretro database naming conventions."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
rename-roms = "rename_roms:main"

[tool.setuptools]
py-modules = ["rename_roms"]
include-package-data = true
